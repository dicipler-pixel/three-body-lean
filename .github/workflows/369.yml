# Check the 3-6-9 straw-man Lean file (core Lean, no Mathlib) on every push that touches it.
name: 3-6-9 Lean check

on:
  push:
    paths: ['369-three-fold-protection/**', '.github/workflows/369.yml']
  pull_request:
    paths: ['369-three-fold-protection/**', '.github/workflows/369.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: No sorry, no axiom declarations
        run: |
          set -euo pipefail
          ! grep -nE '\bsorry\b|^axiom ' 369-three-fold-protection/SM369.lean
      - name: Kernel-check SM369.lean
        run: |
          set -euo pipefail
          lean --version
          lean 369-three-fold-protection/SM369.lean
          echo "SM369.lean: $(grep -c '^theorem' 369-three-fold-protection/SM369.lean) theorems checked"
